

<!-- Например, блок 1 -->


<section class="content-card p-4 p-lg-5 mb-4">
    <div class="row align-items-center g-4">
        <div class="col-lg-6 order-lg-1 order-2">
            {% if city.choose_as_h2 %}
                <h2 class="section-title mb-3">{{ city.choose_as_h2 }}</h2>
            {% endif %}
            {% if city.choose_as %}
                <div class="content-text">
                    {{ city.choose_as|safe|linebreaks }}
                </div>
            {% endif %}
        </div>
        <div class="col-lg-6 order-lg-2 order-1">
            {% if city.img_choose_as %}
                <img src="{{ city.img_choose_as.url }}"
                     class="img-fluid rounded-3 shadow-sm w-100"
                     alt="{{ city.img_choose_as_alt|default:'Изображение' }}">
            {% endif %}
        </div>
    </div>
</section>
