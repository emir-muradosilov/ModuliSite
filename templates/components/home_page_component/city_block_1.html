<section class="content-card p-4 p-lg-5 mb-4">
    <div class="row align-items-center g-4">
        <div class="col-lg-6 order-lg-1 order-2">
            <!--title-->
            {% if site_settings.homepage_title_block_1 %}
                <h2 class="section-title mb-3">{{ site_settings.homepage_title_block_1|safe }}</h2>
            {% endif %}
            <!--text-->
            {% if site_settings.homepage_text_block_1 %}
                <div class="content-text">
                    {{ site_settings.homepage_text_block_1|safe|linebreaks }}
                </div>
            {% endif %}
        </div>
        <div class="col-lg-6 order-lg-2 order-1">
            <!--img-->
            {% if site_settings.img_homepage_block_1 %}
                <img src="{{ site_settings.img_homepage_block_1.url }}"
                     class="img-fluid rounded-3 shadow-sm w-100"
                     alt="{{ site_settings.img_homepage_alt_block_1|default:'Изображение' }}">
            {% endif %}
        </div>
    </div>
</section>
